# Supported Proxmox repositories ("products") for the changelog viewer.
# Each product is a separate Debian repo with its own download base URL.
# Available distros are AUTO-DISCOVERED from the repo's dists/ directory listing;
# `default` is an optional hint for which distro to preselect in the UI
# (falls back to the first discovered if omitted). Only the base URL is required.
products:
  - id: pve
    name: Proxmox VE
    repo: http://download.proxmox.com/debian/pve
    default: trixie
  - id: pve-ceph
    name: Proxmox Ceph (Tentacle)
    repo: http://download.proxmox.com/debian/ceph-tentacle
    default: trixie
  - id: pbs
    name: Proxmox Backup Server
    repo: http://download.proxmox.com/debian/pbs
    default: trixie
  - id: pbs-client
    name: Proxmox Backup Server (Client)
    repo: http://download.proxmox.com/debian/pbs-client
    default: trixie
  - id: pdm
    name: Proxmox Datacenter Manager
    repo: http://download.proxmox.com/debian/pdm
    default: trixie
  - id: pmg
    name: Proxmox Mail Gateway
    repo: http://download.proxmox.com/debian/pmg
    default: trixie

# Upstream-fetch cache TTLs, in seconds. Any key left out falls back to the
# default below (release 300 / packages 900 / changelog 3600 / listing 900).
cache:
  release: 300
  packages: 900
  changelog: 3600
  listing: 900